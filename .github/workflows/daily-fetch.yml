name: Daily Data Fetcher & Alerting

on:
  schedule:
    # 01:00 UTC (ca. 02:00 / 03:00 Uhr nachts deutscher Zeit), Dienstag bis Samstag.
    # Nachtlauf für den vollständigen Datenabgleich aller Provider und täglichen Statusbericht.
    - cron: '0 1 * * 2-6'
    
    # 14:30 bis 20:30 UTC (16:30 bis 22:30 Uhr MESZ), Montag bis Freitag stündlich.
    # Smart-Makro-Szenario Check für zeitnahe Auswertung von US-Releases (JOLTS, NFP, CPI, PCE etc.).
    - cron: '30 14,15,16,17,18,19,20 * * 1-5'
  
  # Erlaubt es dir, den Workflow jederzeit manuell über einen Button auf GitHub zu starten!
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ausführungs-Modus'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'scenario-only'
          - 'fetch-and-indicators'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Notwendig, damit der Bot später die aktualisierte Datenbank zurück pushen darf
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      # 1. Vollständiger EOD Datenabgleich (Nachtlauf oder manuell 'all' / 'fetch-and-indicators')
      - name: 🚀 Run Full Data Fetcher (EOD)
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'fetch-and-indicators')) || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 2-6') }}
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node index.js

      # 2. Indikator- & Regime-Analyse (Nachtlauf oder manuell)
      - name: 📊 Run Indicator Analysis & Alerts
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'fetch-and-indicators')) || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 2-6') }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node index.js --check-indikator

      # 3. Smart-Makro-Szenario Check (Intraday-Fenster oder manuell 'all' / 'scenario-only')
      - name: 🎯 Run Smart Macro Scenario Check
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'scenario-only')) || (github.event_name == 'schedule' && github.event.schedule == '30 14,15,16,17,18,19,20 * * 1-5') }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node index.js --check-scenario

      # 4. Commit und Push für lokale Daten und Alert-History
      - name: 💾 Commit and Push Local Data (CBOE Archives & History)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git add config/alert_history.json || true
          git diff --staged --quiet || (git commit -m "chore: update local data and alert history [skip ci]" && git push)

