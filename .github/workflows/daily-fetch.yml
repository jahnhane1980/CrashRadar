name: Daily Data Fetcher

on:
  schedule:
    # 01:00 UTC (ca. 02:00 / 03:00 Uhr nachts deutscher Zeit), Dienstag bis Samstag.
    # Nachtlauf für den vollständigen Datenabgleich aller Provider.
    - cron: '0 1 * * 2-6'
  
  # Erlaubt es dir, den Workflow jederzeit manuell über einen Button auf GitHub zu starten
  workflow_dispatch:

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run Data Fetcher (EOD)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node index.js

      - name: 💾 Commit and Push Local Data (CBOE Archives & Data)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update local data [skip ci]" && git push)
